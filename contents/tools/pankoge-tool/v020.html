<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイミングよく踊らせるやつ</title>
    <link href="normalize.css" rel="stylesheet" type="text/css">
    <style>
        :root {
            color-scheme: light;
        }

        html {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2933;
            overflow-x: hidden;
            padding-left: env(safe-area-inset-left, 0);
            padding-right: env(safe-area-inset-right, 0);
        }

        main {
            max-width: min(960px, 100vw);
            width: 100%;
            margin: 0 auto;
            padding: 32px calc(clamp(12px, 4vw, 24px) + env(safe-area-inset-right, 0)) 64px calc(clamp(12px, 4vw, 24px) + env(safe-area-inset-left, 0));
            display: grid;
            gap: 32px;
        }

        h1 {
            margin: 0;
            font-size: 1.9rem;
            text-align: center;
            color: #0f172a;
            word-break: keep-all;
        }

        .controls,
        .preview {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 100%;
        }

        .controls form {
            display: grid;
            gap: 24px;
        }

        .field {
            display: grid;
            gap: 8px;
            min-width: 0;
        }

        label {
            font-weight: 600;
            color: #1e293b;
        }

        input[type="number"],
        input[type="file"],
        select {
            font: inherit;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #cbd5f5;
            background: #f8fafc;
            color: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            max-width: 100%;
        }

        input[type="file"] {
            padding: 10px;
            background: #fff;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }

        input[type="number"]:focus,
        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .hint {
            margin: 0;
            font-size: 0.85rem;
            color: #64748b;
            word-break: keep-all;
        }

        .field-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            width: 100%;
            max-width: 100%;
        }

        .stats-row {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: baseline;
            background: #eef2ff;
            border-radius: 12px;
            padding: 12px 14px;
            width: 100%;
            max-width: 100%;
        }

        .stat-inline {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .stat-title {
            margin: 0;
            font-size: 0.8rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e293b;
        }

        .ratio-label {
            margin: 0;
            font-size: 1rem;
            color: #334155;
            font-weight: 500;
        }

        .preset-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            min-width: 0;
        }

        .tempo-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            width: 100%;
            min-width: 0;
            max-width: 100%;
        }

        .tempo-actions button {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #0f172a;
            background: linear-gradient(135deg, #c7d2fe, #a5b4fc);
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
            flex: 0 0 auto;
        }

        .tempo-actions button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.3);
        }

        .tempo-actions button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.25);
        }

        .tempo-actions input[type="number"] {
            flex: 1 1 140px;
            min-width: 0;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
        }

        .preset-label {
            font-weight: 600;
            color: #1e293b;
        }

        .actions button {
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
        }

        .actions button.primary {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .actions button.secondary {
            background: linear-gradient(135deg, #475569, #64748b);
            color: #f8fafc;
        }

        .actions button.ghost {
            background: #e2e8f0;
            color: #1f2937;
        }

        .actions>* {
            min-width: 0;
        }

        .actions button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .actions button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }

        .error {
            margin: 0;
            font-size: 0.9rem;
            color: #b91c1c;
            min-height: 1.2em;
        }

        .preview h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.2rem;
            color: #0f172a;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: 320px;
            border-radius: 18px;
            border: 1px solid #cbd5f5;
            background: radial-gradient(circle at top right, #eff6ff, #ffffff 55%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .stage.playing {
            border-color: #2563eb;
            box-shadow: 0 24px 60px rgba(37, 99, 235, 0.25);
        }

        .stage img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .placeholder {
            color: #64748b;
            font-size: 1rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.6;
        }

        .thumbnails {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            max-width: 100%;
        }

        .thumbnails button {
            padding: 0;
            border: 2px solid transparent;
            border-radius: 12px;
            background: transparent;
            cursor: pointer;
            width: 90px;
            height: 90px;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.14);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .thumbnails button:hover {
            transform: translateY(-2px);
        }

        .thumbnails button.active {
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        .thumbnails img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        footer {
            text-align: center;
        }

        .powered-by {
            margin: 0 0 0.6rem;
            font-size: 0.92rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .logo {
            color: #506b3a;
            font-size: 2rem;
            text-align: center;
            font-weight: 800;
            padding: 2.5rem 0 2rem;
            margin-top: auto;
        }

        .logo span.orange {
            color: #f37043;
        }

        .logo a {
            color: inherit;
            text-decoration: none;
        }

        @media (max-width: 720px) {
            main {
                padding: 20px calc(14px + env(safe-area-inset-right, 0)) 48px calc(14px + env(safe-area-inset-left, 0));
                gap: 24px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .controls,
            .preview {
                padding: 20px;
            }

            .stage {
                min-height: 0;
                aspect-ratio: 1 / 1;
            }

            .stats-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .field-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
        }

        @media (max-width: 520px) {
            .field-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>絵を<wbr>タイミングよく<wbr>踊らせるやつ</h1>
        <section class="controls">
            <form id="controlForm">
                <div class="field">
                    <label for="imageFiles">フレーム画像</label>
                    <input type="file" id="imageFiles" accept="image/*" multiple>
                    <p class="hint">フレームにしたい画像を複数選択してください。<wbr>読み込んだ順番で再生します。</p>
                </div>
                <div class="field-grid">
                    <div class="field">
                        <label for="bpm">テンポ (BPM)</label>
                        <div class="tempo-actions">
                            <input type="number" id="bpm" min="0.01" step="0.01" value="135" aria-label="テンポ (BPM)">
                            <button type="button" id="halfTempoBtn" class="ghost" aria-label="テンポを半分にする">1/2</button>
                            <button type="button" id="doubleTempoBtn" class="ghost" aria-label="テンポを2倍にする">×2</button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="beats">1ループの拍数</label>
                        <input type="number" id="beats" min="0.25" step="0.25" value="2">
                    </div>
                    <div class="stats-row" role="status" aria-live="polite">
                        <div class="stat-inline">
                            <p class="stat-title">フレーム数</p>
                            <p class="stat-value"><span id="frameCount">0</span> 枚</p>
                        </div>
                        <div class="stat-inline">
                            <p class="stat-title">ループ時間</p>
                            <p class="stat-value"><span id="cycleDuration">-</span> 秒</p>
                        </div>
                        <div class="stat-inline">
                            <p class="stat-title">1枚あたり</p>
                            <p class="stat-value"><span id="frameDuration">-</span> 秒</p>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button type="button" id="toggleBtn" class="primary" aria-pressed="false">再生</button>
                    <div class="preset-group" aria-label="プリセット">
                        <span class="preset-label">プリセット:</span>
                        <select id="presetSelect" aria-label="プリセットを選択">
                            <option value="pankoge">パンこげ</option>
                        </select>
                        <button type="button" id="applyPresetBtn" class="ghost">適用</button>
                    </div>
                </div>
                <p class="error" id="errorMessage" role="alert"></p>
            </form>
        </section>
        <section class="preview">
            <!-- <h2>プレビュー</h2> -->
            <div class="stage" id="stage" data-playing="false" aria-live="polite">
                <p class="placeholder">画像を選択するとここでプレビューできます。</p>
            </div>
            <div class="thumbnails" id="thumbnails" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p class="powered-by">Powered by gpt-5.1-codex</p>
        <div class="logo">
            <a href="/">Saboten<span class="orange">i</span>sm</a>
        </div>
    </footer>

    <script>
        (() => {
            const form = document.getElementById("controlForm");
            const imageInput = document.getElementById("imageFiles");
            const bpmInput = document.getElementById("bpm");
            const beatsInput = document.getElementById("beats");
            const toggleBtn = document.getElementById("toggleBtn");
            const presetSelect = document.getElementById("presetSelect");
            const applyPresetBtn = document.getElementById("applyPresetBtn");
            const halfTempoBtn = document.getElementById("halfTempoBtn");
            const doubleTempoBtn = document.getElementById("doubleTempoBtn");
            const stage = document.getElementById("stage");
            const thumbnails = document.getElementById("thumbnails");
            const frameCountEl = document.getElementById("frameCount");
            const cycleDurationEl = document.getElementById("cycleDuration");
            const frameDurationEl = document.getElementById("frameDuration");
            const errorMessageEl = document.getElementById("errorMessage");
            const ratioInfoEl = document.getElementById("ratioInfo");
            let placeholderEl = document.querySelector(".placeholder");
            let stageImage = null;

            const sampleFrameSources = [
                "https://cdn.targoyle.jp/img/amecoro/pankoge_01.webp",
                "https://cdn.targoyle.jp/img/amecoro/pankoge_02.webp",
                "https://cdn.targoyle.jp/img/amecoro/pankoge_03.webp",
                "https://cdn.targoyle.jp/img/amecoro/pankoge_04.webp",
                "https://cdn.targoyle.jp/img/amecoro/pankoge_02.webp",
                "https://cdn.targoyle.jp/img/amecoro/pankoge_06.webp"
            ];

            const presets = {
                pankoge: {
                    name: "パンこげ",
                    bpm: 135,
                    beats: 2,
                    frames: sampleFrameSources
                }
            };

            let frames = [];
            let rafId = null;
            let frameTimerId = null;
            let currentIndex = 0;
            let animationStartMs = 0;
            let cycleMs = 0;
            let frameDurationMs = 0;
            let pausedElapsedMs = 0;
            let lastRenderedIndex = null;
            let preloadPromise = Promise.resolve();
            let lastFrameChangeMs = 0;

            form.addEventListener("submit", (event) => {
                event.preventDefault();
            });

            function formatNumber(value) {
                if (!Number.isFinite(value)) {
                    return "-";
                }
                const digits = 2;
                return Number.parseFloat(value.toFixed(digits)).toString();
            }

            function renderPlaceholder() {
                if (!placeholderEl) {
                    placeholderEl = document.createElement("p");
                    placeholderEl.className = "placeholder";
                    placeholderEl.textContent = "画像を選択するとここでプレビューできます。";
                    stage.appendChild(placeholderEl);
                }
                placeholderEl.style.display = "block";
                if (stageImage) {
                    stageImage.style.display = "none";
                }
                lastRenderedIndex = null;
            }

            function showFrame(index) {
                if (!frames.length) {
                    renderPlaceholder();
                    return;
                }
                if (!stageImage) {
                    stageImage = document.createElement("img");
                    stageImage.className = "frame-image";
                    stageImage.loading = "eager";
                    stageImage.decoding = "sync";
                    stageImage.alt = "フレーム";
                    stageImage.draggable = false;
                    stage.appendChild(stageImage);
                }
                const safeIndex = index % frames.length;
                currentIndex = safeIndex < 0 ? frames.length - 1 : safeIndex;
                if (lastRenderedIndex === currentIndex && stageImage && stageImage.style.display !== "none") {
                    return;
                }
                const nextSrc = frames[currentIndex];
                stageImage.style.display = "block";
                stageImage.src = nextSrc;
                stageImage.alt = `フレーム ${currentIndex + 1}`;
                if (placeholderEl) {
                    placeholderEl.style.display = "none";
                }
                lastRenderedIndex = currentIndex;
            }

            function highlightActiveThumbnail() {
                const buttons = thumbnails.querySelectorAll("button");
                buttons.forEach((button, index) => {
                    button.classList.toggle("active", frames.length > 0 && index === currentIndex);
                });
            }

            function isPlaying() {
                return stage.getAttribute("data-playing") === "true";
            }

            function setPlayingState(active) {
                stage.classList.toggle("playing", active);
                stage.setAttribute("data-playing", active ? "true" : "false");
                toggleBtn.textContent = active ? "停止" : "再生";
                toggleBtn.setAttribute("aria-pressed", active ? "true" : "false");
                toggleBtn.classList.toggle("primary", !active);
                toggleBtn.classList.toggle("secondary", active);
            }

            function setError(message) {
                errorMessageEl.textContent = message || "";
            }

            function updateRatioText() {
                if (!ratioInfoEl) {
                    return;
                }
                const beats = Number.parseFloat(beatsInput.value);
                const beatText = Number.isFinite(beats) ? formatNumber(beats) : beatsInput.value || "0";
                ratioInfoEl.textContent = `${frames.length}枚で${beatText}拍`;
            }

            function updateStats() {
                const bpm = Number.parseFloat(bpmInput.value);
                const beats = Number.parseFloat(beatsInput.value);
                frameCountEl.textContent = frames.length;

                if (frames.length > 0 && Number.isFinite(bpm) && bpm > 0 && Number.isFinite(beats) && beats > 0) {
                    const cycleSeconds = (60 * beats) / bpm;
                    const frameSeconds = cycleSeconds / frames.length;
                    cycleDurationEl.textContent = formatNumber(cycleSeconds);
                    frameDurationEl.textContent = formatNumber(frameSeconds);
                } else {
                    cycleDurationEl.textContent = "-";
                    frameDurationEl.textContent = "-";
                }

                updateRatioText();
            }

            function refreshThumbnails() {
                thumbnails.innerHTML = "";
                frames.forEach((src, index) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    const image = document.createElement("img");
                    image.src = src;
                    image.alt = `フレーム ${index + 1}`;
                    button.appendChild(image);
                    button.addEventListener("click", () => {
                        stopAnimation();
                        currentIndex = index;
                        showFrame(currentIndex);
                        highlightActiveThumbnail();
                    });
                    thumbnails.appendChild(button);
                });
                highlightActiveThumbnail();
            }

            function preloadFrames(sources) {
                return Promise.all(
                    sources.map(
                        (src) =>
                            new Promise((resolve) => {
                                const img = new Image();
                                img.onload = () => resolve();
                                img.onerror = () => resolve();
                                img.src = src;
                            })
                    )
                );
            }

            function stopAnimation(options = {}) {
                const { resetIndex = false } = options;
                if (rafId) {
                    window.cancelAnimationFrame(rafId);
                    rafId = null;
                }
                if (frameTimerId) {
                    window.clearTimeout(frameTimerId);
                    frameTimerId = null;
                }
                if (!resetIndex && frames.length && cycleMs > 0) {
                    const now = performance.now();
                    pausedElapsedMs = ((now - animationStartMs) % cycleMs + cycleMs) % cycleMs;
                } else {
                    pausedElapsedMs = 0;
                }
                if (resetIndex) {
                    currentIndex = 0;
                }
                setPlayingState(false);
                if (frames.length) {
                    showFrame(currentIndex);
                    highlightActiveThumbnail();
                } else {
                    renderPlaceholder();
                }
            }

            function setFrames(sources) {
                stopAnimation({ resetIndex: true });
                frames = sources.slice();
                animationStartMs = 0;
                cycleMs = 0;
                frameDurationMs = 0;
                pausedElapsedMs = 0;
                lastRenderedIndex = null;
                preloadPromise = preloadFrames(frames);
                lastFrameChangeMs = 0;

                if (!frames.length) {
                    renderPlaceholder();
                    refreshThumbnails();
                    updateStats();
                    setError("");
                    return;
                }

                showFrame(currentIndex);
                refreshThumbnails();
                updateStats();
                setError("");
            }

            function startAnimation(keepIndex = false) {
                const bpm = Number.parseFloat(bpmInput.value);
                const beats = Number.parseFloat(beatsInput.value);

                if (!frames.length) {
                    setError("先にフレーム画像を読み込んでください。");
                    return;
                }
                if (!Number.isFinite(bpm) || bpm <= 0) {
                    setError("BPM は 1 以上の数値を指定してください。");
                    return;
                }
                if (!Number.isFinite(beats) || beats <= 0) {
                    setError("拍数は正の数値で指定してください。");
                    return;
                }

                const nextCycleMs = ((60 * beats) / bpm) * 1000;
                const nextFrameDurationMs = nextCycleMs / frames.length;

                if (
                    !Number.isFinite(nextCycleMs) ||
                    nextCycleMs <= 0 ||
                    !Number.isFinite(nextFrameDurationMs) ||
                    nextFrameDurationMs <= 0
                ) {
                    setError("設定の組み合わせを確認してください。");
                    return;
                }

                cycleMs = nextCycleMs;
                frameDurationMs = nextFrameDurationMs;

                setError("");
                updateStats();

                if (!keepIndex) {
                    currentIndex = 0;
                    pausedElapsedMs = 0;
                }

                if (rafId) {
                    window.cancelAnimationFrame(rafId);
                    rafId = null;
                }
                if (frameTimerId) {
                    window.clearTimeout(frameTimerId);
                    frameTimerId = null;
                }

                const offset = keepIndex ? pausedElapsedMs || currentIndex * frameDurationMs : 0;
                const startAfterPreload = () => {
                    const wrappedOffset = ((offset % cycleMs) + cycleMs) % cycleMs;
                    const normalizedIndex = Math.floor(wrappedOffset / frameDurationMs) % frames.length;
                    animationStartMs = performance.now() - wrappedOffset;
                    pausedElapsedMs = 0;
                    currentIndex = normalizedIndex;
                    lastFrameChangeMs = animationStartMs + normalizedIndex * frameDurationMs;

                    showFrame(currentIndex);
                    highlightActiveThumbnail();

                    const scheduleFrame = () => {
                        if (cycleMs <= 0) {
                            return;
                        }
                        const now = performance.now();
                        const elapsedMs = now - animationStartMs;
                        const cycleElapsed = ((elapsedMs % cycleMs) + cycleMs) % cycleMs;
                        const targetIndex = Math.floor(cycleElapsed / frameDurationMs) % frames.length;
                        if (targetIndex !== currentIndex) {
                            currentIndex = targetIndex;
                            lastFrameChangeMs = animationStartMs + Math.floor(elapsedMs / frameDurationMs) * frameDurationMs;
                            showFrame(currentIndex);
                            highlightActiveThumbnail();
                        }
                        const nextBoundary = animationStartMs + (Math.floor(elapsedMs / frameDurationMs) + 1) * frameDurationMs;
                        const delay = Math.max(0, nextBoundary - performance.now() - 1);
                        frameTimerId = window.setTimeout(scheduleFrame, delay);
                    };

                    scheduleFrame();
                    setPlayingState(true);
                };

                (preloadPromise || Promise.resolve()).then(startAfterPreload);
            }

            function loadImages(fileList) {
                const files = Array.from(fileList).filter((file) => file.type.startsWith("image/"));
                if (!files.length) {
                    setError("画像ファイルを選択してください。");
                    imageInput.value = "";
                    return;
                }

                Promise.all(
                    files.map(
                        (file) =>
                            new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload = () => resolve(reader.result);
                                reader.onerror = () => reject(new Error("画像の読み込みに失敗しました。"));
                                reader.readAsDataURL(file);
                            })
                    )
                )
                    .then((results) => {
                        setFrames(results);
                    })
                    .catch(() => {
                        setError("画像の読み込みに失敗しました。");
                    })
                    .finally(() => {
                        imageInput.value = "";
                    });
            }

            function applyPreset(presetId) {
                const preset = presets[presetId];
                if (!preset) {
                    return;
                }
                stopAnimation({ resetIndex: true });
                bpmInput.value = preset.bpm;
                beatsInput.value = preset.beats;
                setFrames(preset.frames);
                updateStats();
                setError("");
            }

            function hydratePresetSelect() {
                presetSelect.innerHTML = "";
                Object.entries(presets).forEach(([key, preset]) => {
                    const option = document.createElement("option");
                    option.value = key;
                    option.textContent = preset.name;
                    presetSelect.appendChild(option);
                });
            }

            imageInput.addEventListener("change", (event) => {
                if (event.target.files) {
                    loadImages(event.target.files);
                }
            });

            bpmInput.addEventListener("input", () => {
                updateStats();
                if (isPlaying()) {
                    startAnimation(true);
                }
            });

            beatsInput.addEventListener("input", () => {
                updateStats();
                if (isPlaying()) {
                    startAnimation(true);
                }
            });

            function adjustTempo(multiplier) {
                const current = Number.parseFloat(bpmInput.value);
                const next = Number.isFinite(current) ? Math.max(0.01, current * multiplier) : 135;
                bpmInput.value = formatNumber(next);
                updateStats();
                if (isPlaying()) {
                    startAnimation(true);
                }
            }

            halfTempoBtn.addEventListener("click", () => {
                adjustTempo(0.5);
            });

            doubleTempoBtn.addEventListener("click", () => {
                adjustTempo(2);
            });

            toggleBtn.addEventListener("click", () => {
                if (isPlaying()) {
                    stopAnimation();
                } else {
                    const shouldResume = pausedElapsedMs > 0 || currentIndex !== 0;
                    startAnimation(shouldResume);
                }
            });

            applyPresetBtn.addEventListener("click", () => {
                applyPreset(presetSelect.value);
            });

            hydratePresetSelect();
            applyPreset("pankoge");
        })();
    </script>
</body>

</html>
